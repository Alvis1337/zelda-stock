# Template only. Never commit real values. Create the real Secret with:
#
#   kubectl -n zelda-stock create secret generic zelda-stock \
#     --from-literal=API_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=NTFY_TOPIC=zelda-$(openssl rand -hex 8)
#
# Later, for FCM, add the Firebase service account:
#   kubectl -n zelda-stock create secret generic zelda-stock --dry-run=client -o yaml \
#     --from-literal=API_TOKEN=... --from-literal=NTFY_TOPIC=... \
#     --from-file=sa.json=./firebase-service-account.json | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: zelda-stock
  namespace: zelda-stock
type: Opaque
stringData:
  API_TOKEN: change-me
  NTFY_TOPIC: zelda-change-me   # on ntfy.sh the topic name is the password; make it unguessable
  # NTFY_TOKEN: tk_...          # only for an access-controlled ntfy server
  # sa.json: |                  # Firebase service account, only for PUSH=fcm
  #   { ... }
