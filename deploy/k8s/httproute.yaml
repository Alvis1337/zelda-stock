# zelda-stock.chrisalvis.me through the Cloudflare tunnel. The hostname is a Cloudflare
# Access app that only lets in the "zelda-stock-app" service token (the phone) and the
# admin policies; the server also checks the Access JWT. external-dns creates the record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zelda-stock-tunnel
spec:
  hostnames:
    - zelda-stock.chrisalvis.me
  parentRefs:
    - name: kakariko-tunnel
      namespace: default
  rules:
    - backendRefs:
        - name: zelda-stock-server
          port: 8080
