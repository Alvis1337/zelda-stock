plugins {
    id 'com.android.application'
}

android {
    namespace 'me.chrisalvis.zeldastock'
    compileSdk 35

    defaultConfig {
        applicationId 'me.chrisalvis.zeldastock'
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<commit count>, matching the v1.0.<N> release tag
        // the in-app updater compares against.
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.0.${versionCode}"
    }

    // Signing: CI passes a fixed key through ZS_KEYSTORE / ZS_KEYSTORE_PASSWORD so every
    // build installs over the last one. Without it, builds use the debug key (which
    // changes per CI machine, so updates won't install over each other).
    def ks = System.getenv('ZS_KEYSTORE')
    signingConfigs {
        stable {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ZS_KEYSTORE_PASSWORD')
                keyAlias 'zeldastock'
                keyPassword System.getenv('ZS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig ks ? signingConfigs.stable : signingConfigs.debug
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    // Scripts live in the top-level checks/ folder, shared with the server (checkout uses common.js + assist.js).
    sourceSets { main { assets.srcDirs += ['../../checks'] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.unifiedpush.android:connector:3.3.5'
}
